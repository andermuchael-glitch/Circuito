name: Publicar no GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instalar SDK oficial TomTom
        run: npm install --no-save --legacy-peer-deps @tomtom-org/maps-sdk
      - name: Gerar o site
        run: |
          set +e
          node scripts/with-app-env.mjs ./node_modules/.bin/vite build > /tmp/vite-build.log 2>&1
          build_status=$?
          set -e
          cat /tmp/vite-build.log

          if [ "$build_status" -ne 0 ]; then
            if grep -Fq "rolldownOptions.input should not be an html file when building for SSR" /tmp/vite-build.log \
              && [ -f node_modules/.nitro/vite/services/ssr/index.js ]; then
              echo "::warning::Vite/Nitro reported its known secondary SSR-build error after generating the Pages SSR bundle; validating the final static output."
            else
              echo "::error::Vite build failed before producing a usable Pages bundle."
              exit "$build_status"
            fi
          fi

          node scripts/finalize-pages.mjs
        env:
          NITRO_PRESET: github_pages
          VITE_TOMTOM_API_KEY: ${{ secrets.VITE_TOMTOM_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
