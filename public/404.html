<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abrindo acompanhamento — Circuito</title>
<script>
(function () {
  var base = "/Circuito/";
  var path = window.location.pathname;
  if (path.indexOf(base) === 0) path = path.slice(base.length);
  else path = path.replace(/^\//, "");
  var target = base + "?p=" + encodeURIComponent("/" + path + window.location.search + window.location.hash);
  window.location.replace(target);
})();
</script>
</head>
<body style="background:#07110c;color:#e7f0e9;font:16px Arial,sans-serif;padding:24px">
Abrindo o acompanhamento…
</body>
</html>
