plugins {
    id "com.android.application"
}

android {
    namespace "app.circuito"
    compileSdk 35

    defaultConfig {
        applicationId "app.circuito"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
